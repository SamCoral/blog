<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - TechPulse</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

    <div class="background-orbs" aria-hidden="true">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    
    <header class="navbar admin-navbar">
        <div class="container nav-container">
            <a href="../index.html" class="logo">Tech<span>Pulse</span> Admin</a>
            <div class="nav-actions">
                <button id="themeToggle" class="icon-btn" aria-label="Toggle Dark Mode">🌙</button>
                <button id="logoutBtn" class="btn btn-outline-danger">Logout</button>
            </div>
        </div>
    </header>

    <main class="container admin-main">
        <div class="dashboard-header">
            <div>
                <h1>Dashboard Overview</h1>
                <p>Manage content, view metrics, and edit articles.</p>
            </div>
            <a href="create-post.html" class="btn btn-primary">+ Create New Post</a>
        </div>

    
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Posts</h3>
                <p id="statTotalPosts" class="stat-number">0</p>
            </div>
            <div class="stat-card">
                <h3>Published</h3>
                <p id="statPublishedPosts" class="stat-number">0</p>
            </div>
            <div class="stat-card">
                <h3>Drafts</h3>
                <p id="statDraftPosts" class="stat-number">0</p>
            </div>
            <div class="stat-card">
                <h3>Total Comments</h3>
                <p id="statTotalComments" class="stat-number">0</p>
            </div>
            <div class="stat-card">
                <h3>Total Reactions</h3>
                <p id="statTotalReactions" class="stat-number">0</p>
            </div>
        </div>

        
        <section class="table-section">
            <h2>All Articles</h2>
            <div class="table-responsive">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Comments</th>
                            <th>Reactions</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="adminPostsTable">
                        
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="toastContainer" class="toast-container"></div>

    <script src="../js/data.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
